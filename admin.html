<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ Панель</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>

  <nav class="navbar navbar-light bg-light shadow-sm">
    <div class="container d-flex justify-content-between">
      <a class="navbar-brand" href="index.html">Uzum Market</a>
      <div>
        <a class="nav-link d-inline-block mx-2" href="index.html">Продукты</a>
        <a class="nav-link d-inline-block mx-2" href="basket.html">Корзина</a>
        <a class="nav-link d-inline-block mx-2" href="admin.html">Админ</a>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h2 class="text-center">Добавить продукт</h2>
    <form id="product-form" class="p-3 border rounded bg-white shadow-sm">
      <input type="text" id="name" class="form-control mb-3" placeholder="Название продукта" required>
      <input type="number" id="price" class="form-control mb-3" placeholder="Цена" required>
      <input type="file" id="image" class="form-control mb-3" accept="image/*" required>
      <button type="button" class="btn btn-primary w-100" onclick="addProduct()">Добавить</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>

</html>
