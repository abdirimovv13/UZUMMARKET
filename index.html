<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uzum Market</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="index.html">Uzum Market</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Продукты</a></li>
          <li class="nav-item"><a class="nav-link" href="basket.html">Корзина</a></li>
          <li class="nav-item"><a class="nav-link" href="admin.html">Админ</a></li>
        </ul>
        <form class="d-flex ms-3" onsubmit="event.preventDefault(); searchProducts();">
          <input id="search-input" class="form-control" type="search" placeholder="🔍 Искать..." oninput="searchProducts()">
        </form>
      </div>
    </div>
  </nav>

  <div id="carousel" class="carousel slide mt-3" data-bs-ride="carousel">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carousel" data-bs-slide-to="0" class="active"></button>
      <button type="button" data-bs-target="#carousel" data-bs-slide-to="1"></button>
      <button type="button" data-bs-target="#carousel" data-bs-slide-to="2"></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active"><img src="./i.webp" class="d-block w-100" style="max-height: 300px;"></div>
      <div class="carousel-item"><img src="./i (2).webp" class="d-block w-100" style="max-height: 300px;"></div>
      <div class="carousel-item"><img src="./i (1).webp" class="d-block w-100" style="max-height: 300px;"></div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>

  <div class="container mt-4">
    <h2 class="text-center">Продукты</h2>
    <div class="row row-cols-1 row-cols-md-3 g-4" id="product-list"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
